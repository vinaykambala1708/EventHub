spring.application.name=eventhub
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Aiven Cloud MySQL is the only runtime database. Provide these values in the
# process environment; Spring does not read .env files automatically.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=${JWT_SECRET}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN:false}
# Adopt the existing Aiven schema at V1, then apply later migrations.
# Existing defaultdb schema predates this app's Flyway migrations; use Hibernate update.
spring.flyway.enabled=false
